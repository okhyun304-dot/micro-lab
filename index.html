<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마이크로 웹 실험실</title>
<meta name="description" content="마케팅주의자 · 행동주의자의 작은 웹 실험들">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#F5F4F0;--surface:#FFFFFF;--ink:#24272B;--muted:#80858C;--line:#E4E1DB;--accent:#2E6B5E;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.7;word-break:keep-all}
.app{max-width:520px;margin:0 auto;padding-inline:22px;padding-block:48px}
h1{font-size:24px;margin:0 0 6px}
p{margin:0;color:var(--muted)}
a.card{display:block;margin-top:16px;padding:20px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
a.card:hover{border-color:var(--accent)}
a.card b{display:block;font-size:18px}
a.card span{font-size:14.5px;color:var(--muted)}
a.card i{font-style:normal;color:var(--accent);font-weight:700;font-size:14px}
footer{margin-top:32px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <h1>마이크로 웹 실험실</h1>
  <p>작은 웹 실험을 매주 하나씩 만듭니다.</p>
  <a class="card" href="consistency/"><b>꾸준함의 착시</b><span>매일 60분 vs 매일 30분. 100일 뒤 누가 더 많이 했을까?</span><br><i>해보기 →</i></a>
  <a class="card" href="survival/"><b>내 사업의 생존지도</b><span>5년 전 같은 업종으로 문을 연 100곳, 지금 몇 곳이 남아 있을까?</span><br><i>해보기 →</i></a>
  <footer>마케팅주의자 · Powered by 행동주의자</footer>
</div>
</body>
</html>
