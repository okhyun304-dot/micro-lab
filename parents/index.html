<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앞으로 몇 번</title>
<meta name="description" content="앞으로 부모님을 몇 번 더 만날 수 있을까요? 국가데이터처 생명표로 계산해 봅니다.">
<meta property="og:title" content="앞으로 몇 번">
<meta property="og:description" content="앞으로 부모님을 몇 번 더 만날 수 있을까요?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 분위기: 기억 장면은 따뜻한 평면 그림, 데이터 장면은 남색 + 분홍 강조 한 가지 */
:root{
  --navy:#0B1E3F; --navy2:#13305E; --cell:#3E8BC9; --cell-dim:#1C3A66; --pink:#E8457A;
  --warm:#F6C445; --leaf:#C9D86B; --sky:#8FD3E8; --sea:#4BB8D9; --apricot:#F2A65A;
  --ink:#1D2433; --paper:#FFFDF7; --white:#fff;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--navy);color:var(--white);font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;transition:background .6s ease}
body.warm{background:var(--warm)}
body.pinkbg{background:var(--pink)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.app{position:relative;max-width:520px;margin:0 auto;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;user-select:none;-webkit-tap-highlight-color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0;font-size:13px;opacity:.8}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.25;transition:opacity .3s}
.dots i.on{opacity:.9}
.skip{background:none;border:0;padding:6px 0;font-size:15px;opacity:.75}
.scene{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 18px 24px;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.art{width:100%;max-width:420px;margin:0 auto;display:block}
.title{text-align:center;margin:0 auto 18px;max-width:380px}
.title h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
.title p{margin:8px 0 0;font-size:16.5px;font-weight:500;opacity:.8}
.cap{margin:22px auto 0;max-width:380px;text-align:center;font-size:22px;line-height:1.6;font-weight:500}
.cap p{margin:0;opacity:0;transform:translateY(6px);transition:opacity .6s ease,transform .6s ease}
.cap p.on{opacity:1;transform:none}
.cap small{display:block;font-size:15px;font-weight:400;opacity:.7;margin-top:6px}
.hint{text-align:center;font-size:14px;opacity:0;margin-top:22px;transition:opacity .6s}
.hint.on{opacity:.6;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
body.warm .scene{color:var(--ink)}
body.warm .top{color:var(--ink)}
.tag{display:inline-block;background:var(--pink);color:#fff;font-size:14.5px;font-weight:700;padding:4px 10px;border-radius:3px;margin-bottom:10px}
.glabel{font-size:14.5px;opacity:.8;margin:12px 0 6px}
.glabel b{color:var(--pink);font-weight:700}
canvas{display:block;max-width:100%}
.gridwrap{max-width:420px;width:100%;margin:0 auto}
.tlc{text-align:center;font-size:24px;font-weight:700;min-height:1.6em;margin-top:10px}
.tlc b{color:var(--pink);font-size:34px}

/* 입력 */
.ask{max-width:380px;margin:0 auto;width:100%}
.ask h2{font-size:26px;font-weight:700;margin:0 0 6px;line-height:1.45}
.ask .sub{font-size:16px;opacity:.75;margin:0 0 22px}
.q{margin-bottom:24px}
.q .ql{font-size:17px;font-weight:500;margin-bottom:10px}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--navy2);border-radius:14px;padding:10px}
.stepper button{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.1);font-size:24px;line-height:1}
.stepper output{font-size:36px;font-weight:700;min-width:96px;text-align:center}
.stepper output small{font-size:16px;font-weight:400;margin-left:2px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:1.5px solid rgba(255,255,255,.18);background:transparent;border-radius:12px;padding:15px 8px;font-size:17px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--pink);background:rgba(232,69,122,.16)}
.chip small{display:block;font-size:13.5px;opacity:.65;font-weight:400;margin-top:2px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:17px;font-size:18.5px;font-weight:700;background:var(--pink);color:#fff;margin-top:6px;text-align:center;text-decoration:none}
.btn:disabled{opacity:.35}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.35);font-weight:500;margin-top:10px}
.howbox{margin-top:12px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.07);font-size:14.5px;line-height:1.7}
.howbox ul{margin:0;padding-left:18px}
.howbox li+li{margin-top:6px}

/* 결과 */
.big{font-size:64px;font-weight:900;line-height:1.05;margin:4px 0 2px;color:var(--white)}
.big small{font-size:24px;font-weight:500;margin-left:4px}
.resk{font-size:17.5px;opacity:.85;margin:0}
.resd{font-size:15.5px;opacity:.7;margin:6px 0 0;line-height:1.6}
.note{font-size:14px;opacity:.65;margin-top:14px;line-height:1.6}
.note button{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px;color:inherit}
.slider{margin:18px 0 6px}
.slider input{width:100%;accent-color:var(--pink)}
.srow{display:flex;justify-content:space-between;font-size:13.5px;opacity:.6}
.delta{font-size:19.5px;font-weight:700;margin:12px 0 0;min-height:1.6em}
.delta b{color:var(--pink)}

/* 마지막: 사진 + 질문 */
.photo{width:76%;max-width:300px;margin:0 auto;background:#fff;padding:10px 10px 34px;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.35);transform:rotate(-4deg) translateY(-30px);opacity:0;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s}
.photo.on{transform:rotate(-4deg);opacity:1}
.photo svg{display:block;width:100%}
.qcard{margin:26px auto 0;max-width:360px;background:var(--paper);color:var(--ink);border-radius:16px;padding:18px;text-align:center}
.qcard .qk{font-size:14.5px;color:#7a7f89;margin:0}
.qcard .qt{font-size:23px;font-weight:700;line-height:1.5;margin:8px 0 14px;min-height:3em;display:flex;align-items:center;justify-content:center}
.qrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qrow button{border:1px solid #e1ddd2;background:#fff;border-radius:10px;padding:12px 6px;font-size:15.5px;color:var(--ink)}
.end{max-width:360px;margin:18px auto 0;width:100%}
.end .btn{margin-top:10px}
.final{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px;border-radius:14px;background:rgba(255,255,255,.08);text-decoration:none;color:#fff}
.final .fk{font-size:13.5px;opacity:.7}
.final .ft{font-size:17px;font-weight:700}
.final .go{margin-left:auto;font-size:18px;color:var(--pink)}
details.src{margin:18px auto 0;max-width:360px;font-size:14px;opacity:.75;line-height:1.7}
details.src summary{cursor:pointer}
details.src ul{padding-left:18px;margin:8px 0}
.again{display:block;margin:14px auto 0;background:none;border:0;font-size:15px;opacity:.7;text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#000c;color:#fff;font-size:14px;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.scene.gift{color:var(--ink);text-align:center}
.gift .gk{margin:0;font-size:15px;font-weight:500;opacity:.75}
.gift .gt{margin:6px 0 14px;font-size:28px;font-weight:900;line-height:1.35}
.steps{list-style:none;margin:16px auto 0;padding:0;max-width:380px;text-align:left;counter-reset:st}
.steps li{position:relative;padding:10px 0 10px 40px;border-top:1px solid rgba(0,0,0,.08);counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--pink);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center}
.steps b{display:block;font-size:17px}
.steps span{display:block;font-size:14.5px;opacity:.75;margin-top:2px;line-height:1.55}
.gnote{font-size:14.5px;opacity:.75;margin:16px auto 4px;max-width:360px;line-height:1.6}
.gift .btn{max-width:380px;margin-left:auto;margin-right:auto}
.gift .btn.ghost{border-color:rgba(29,36,51,.3);color:var(--ink)}
.gift .q{max-width:380px;margin:16px auto 0;text-align:left}
.thanks{font-size:16px;font-weight:700;margin:16px 0 0}
.chips3{display:flex;flex-wrap:wrap;gap:8px}
.gift .chip{border-color:rgba(29,36,51,.22);padding:11px 14px;font-size:15.5px;color:var(--ink)}
.gift .chip[aria-pressed="true"]{border-color:var(--pink);background:rgba(232,69,122,.14)}
.gift details.src{text-align:left}
.testpill{position:fixed;left:8px;bottom:8px;background:#c0392b;color:#fff;font-size:11px;padding:4px 8px;border-radius:10px;z-index:9}
.friend{max-width:380px;margin:0 auto 14px;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-size:15px;text-align:center}
body.warm .friend{background:rgba(0,0,0,.08)}

/* 그림 움직임 */
.wave{transform-box:fill-box;transform-origin:10% 90%;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
.away{transform-box:fill-box;transform-origin:50% 60%;animation:away 6s ease-out forwards}
@keyframes away{from{transform:scale(1)}to{transform:scale(.55) translateY(10px)}}
.road{animation:road .6s linear infinite}
@keyframes road{from{transform:translateY(0)}to{transform:translateY(16px)}}
.steam{animation:steam 2.4s ease-in-out infinite;opacity:.6}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.6}100%{transform:translateY(-10px);opacity:0}}
@media (prefers-reduced-motion:reduce){.wave,.away,.road,.steam,.hint.on{animation:none}.photo{transition:none}}
</style>
</head>
<body class="warm">
<div class="app" id="app">
  <div class="top"><div class="dots" id="dots"></div><button class="skip" id="skip" type="button">건너뛰기</button></div>
  <div id="stage" style="flex:1;display:flex;flex-direction:column"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- 설정 ---------- */
const CONFIG={
  umamiWebsiteId:"7b5f85ea-0244-4a1b-97fb-92e3cdfba938",
  umamiDomains:"okhyun304-dot.github.io",
  kakaoJsKey:"",
  links:{ final:"" }   // 마지막 링크 1개 (목적지 미정 — 비어 있으면 숨김)
};

/* ---------- 익명 이벤트 (생존지도·꾸준함과 같은 방식) ---------- */
const SVC='parents';
(function(){const t=new URLSearchParams(location.search).get('mlab_test');try{if(t==='1')localStorage.setItem('umami.disabled','1');if(t==='0')localStorage.removeItem('umami.disabled');}catch(e){}})();
function isTest(){try{return localStorage.getItem('umami.disabled')==='1';}catch(e){return false;}}
const EVQ=[];let umamiReady=false;const FIRED=new Set();
function track(name,data){const d=Object.assign({svc:SVC},data||{});if(umamiReady&&window.umami&&umami.track){try{umami.track(name,d);}catch(e){}}else EVQ.push([name,d]);if(location.hostname==='localhost'||location.protocol==='file:'||isTest())console.log('[event]',name,d);}
function trackOnce(name,data){if(FIRED.has(name))return;FIRED.add(name);track(name,data);}
if(CONFIG.umamiWebsiteId){const s=document.createElement('script');s.defer=true;s.src='https://cloud.umami.is/script.js';s.dataset.websiteId=CONFIG.umamiWebsiteId;s.dataset.domains=CONFIG.umamiDomains;
  s.onload=()=>{umamiReady=true;while(EVQ.length){const [n,d]=EVQ.shift();try{umami.track(n,d);}catch(e){}}};document.head.appendChild(s);}
if(isTest())document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.className='testpill';b.textContent='테스트 모드 · 집계 제외';document.body.appendChild(b);});

/* ---------- 데이터: 국가데이터처 2024년 완전 생명표, 남녀 전체 기대여명 (40~100+세) ---------- */
const EX={40:44.65,41:43.70,42:42.75,43:41.79,44:40.84,45:39.90,46:38.95,47:38.01,48:37.07,49:36.13,
50:35.20,51:34.27,52:33.35,53:32.43,54:31.52,55:30.60,56:29.70,57:28.79,58:27.89,59:27.00,
60:26.10,61:25.21,62:24.33,63:23.45,64:22.58,65:21.71,66:20.85,67:19.99,68:19.14,69:18.30,
70:17.46,71:16.64,72:15.83,73:15.03,74:14.25,75:13.48,76:12.72,77:11.97,78:11.24,79:10.53,
80:9.85,81:9.20,82:8.58,83:7.98,84:7.42,85:6.89,86:6.39,87:5.92,88:5.49,89:5.08,
90:4.70,91:4.34,92:4.02,93:3.72,94:3.44,95:3.19,96:2.96,97:2.74,98:2.55,99:2.38,100:2.22};
const CHILD_YEARS=20, CHILD_DAYS=CHILD_YEARS*365;   // 스무 살까지 매일 함께했다고 가정
const VISITS=[{v:2,t:'명절만',s:'1년에 2번'},{v:4,t:'3~5번',s:'1년에 4번'},{v:12,t:'한 달에 한 번',s:'1년에 12번'},{v:52,t:'매주',s:'1년에 52번'}];
const EXAMPLE={age:63,v:4};
const state={age:63,v:null,guess:null};
const visitsLeft=(age,v)=>Math.round(EX[Math.min(100,Math.max(40,age))]*v);   // 앞으로 만날 횟수 = 기대여명 × 1년에 만나는 횟수 (반올림)

/* ---------- 그림: 평면 사람 ---------- */
const SKIN='#F4C6A0';
function person({x,y,s=1,shirt,pants='#2B3A67',hair,hairStyle='short',pose='stand',flip=false}){
  const wave=pose==='wave', sit=pose==='sit';
  const legs=sit?`<rect x="-14" y="30" width="30" height="12" rx="6" fill="${pants}"/><rect x="10" y="30" width="10" height="26" rx="5" fill="${pants}"/><rect x="-14" y="30" width="10" height="26" rx="5" fill="${pants}"/>`
                :`<rect x="-12" y="34" width="10" height="34" rx="5" fill="${pants}"/><rect x="2" y="34" width="10" height="34" rx="5" fill="${pants}"/>`;
  const hairSvg=hairStyle==='long'
    ?`<path d="M-17 -38 q17 -22 34 0 v26 q-6 4 -8 -2 v-14 h-18 v14 q-2 6 -8 2z" fill="${hair}"/>`
    :`<path d="M-16 -36 q16 -20 32 0 v6 h-32z" fill="${hair}"/>`;
  const armR=wave?`<g class="wave"><rect x="12" y="-26" width="9" height="30" rx="4.5" fill="${shirt}" transform="rotate(-150 16 0)"/><circle cx="26" cy="-30" r="5" fill="${SKIN}"/></g>`
                 :`<rect x="12" y="2" width="9" height="28" rx="4.5" fill="${shirt}"/>`;
  return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})">
    ${legs}
    <rect x="-16" y="0" width="32" height="38" rx="12" fill="${shirt}"/>
    <rect x="-21" y="2" width="9" height="28" rx="4.5" fill="${shirt}"/>${armR}
    <circle cx="0" cy="-22" r="16" fill="${SKIN}"/>${hairSvg}
    <circle cx="-5" cy="-21" r="1.8" fill="#2a2a2a"/><circle cx="5" cy="-21" r="1.8" fill="#2a2a2a"/>
    <path d="M-4 -14 q4 3 8 0" stroke="#b5654a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>`;
}
const DAD={shirt:'#2E9CCA',pants:'#24406E',hair:'#3A2A20'}, MOM={shirt:'#E8457A',pants:'#5B3A6E',hair:'#3A2A20',hairStyle:'long'};
const GRAY='#B9BCC4';

/* 장면 1: 식탁 (따뜻한 노랑) */
function artHome(){return `<svg class="art" viewBox="0 0 360 290" aria-hidden="true">
  <rect width="360" height="290" fill="#F6C445"/>
  <rect x="0" y="200" width="360" height="90" fill="#E9A23B"/>
  <rect x="238" y="34" width="86" height="70" rx="6" fill="#fff"/><rect x="244" y="40" width="74" height="58" rx="3" fill="#8FD3E8"/><rect x="279" y="40" width="4" height="58" fill="#fff"/>
  <circle cx="70" cy="64" r="22" fill="#fff"/><circle cx="70" cy="64" r="18" fill="#FFF6DE"/><path d="M70 64 V50 M70 64 L80 70" stroke="#1D2433" stroke-width="3" stroke-linecap="round"/>
  <rect x="34" y="120" width="16" height="80" fill="#C9D86B"/><circle cx="42" cy="112" r="20" fill="#9BBF4E"/>
  ${person({x:112,y:168,...DAD,pose:'sit'})}
  ${person({x:250,y:168,...MOM,pose:'sit',flip:true})}
  ${person({x:181,y:158,s:.72,shirt:'#F2A65A',pants:'#2B3A67',hair:'#2a1d16'})}
  <ellipse cx="181" cy="214" rx="104" ry="20" fill="#2E9CCA"/><rect x="100" y="214" width="8" height="52" fill="#24406E"/><rect x="254" y="214" width="8" height="52" fill="#24406E"/>
  <ellipse cx="181" cy="208" rx="96" ry="14" fill="#4BB8D9"/>
  <ellipse cx="146" cy="205" rx="14" ry="5" fill="#fff"/><ellipse cx="216" cy="205" rx="14" ry="5" fill="#fff"/><ellipse cx="181" cy="203" rx="16" ry="6" fill="#fff"/>
  <path class="steam" d="M178 192 q-4 -6 0 -12 q4 -6 0 -12" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>`;}

/* 장면 2: 떠나는 차 — 뒷창으로 손 흔드는 부모님 (분홍 차 안) */
function artCar(){return `<svg class="art" viewBox="0 0 360 290" aria-hidden="true">
  <rect width="360" height="290" fill="#E8457A"/>
  <clipPath id="win"><rect x="34" y="34" width="292" height="176" rx="36"/></clipPath>
  <g clip-path="url(#win)">
    <rect x="0" y="0" width="360" height="290" fill="#8FD3E8"/>
    <rect x="0" y="150" width="360" height="140" fill="#C9D86B"/>
    <g class="away">
      <polygon points="150,96 180,74 210,96" fill="#E8457A"/><rect x="156" y="96" width="48" height="40" fill="#F6C445"/><rect x="174" y="112" width="12" height="24" fill="#24406E"/>
      <path d="M150 210 L170 136 L190 136 L210 210 Z" fill="#9AA4B5"/>
      <g class="road"><rect x="178" y="140" width="4" height="8" fill="#fff"/><rect x="178" y="158" width="4" height="10" fill="#fff"/><rect x="177" y="180" width="6" height="12" fill="#fff"/><rect x="177" y="204" width="6" height="14" fill="#fff"/></g>
      ${person({x:132,y:132,s:.8,...DAD,pose:'wave'})}
      ${person({x:228,y:132,s:.8,...MOM,pose:'wave',flip:true})}
    </g>
  </g>
  <rect x="34" y="34" width="292" height="176" rx="36" fill="none" stroke="#C2335F" stroke-width="10"/>
  <rect x="0" y="232" width="360" height="58" fill="#C2335F"/>
  <path d="M232 296 a62 62 0 0 1 124 0" fill="none" stroke="#1D2433" stroke-width="13" opacity=".35"/>
  <circle cx="74" cy="262" r="22" fill="#2a1d16"/><rect x="50" y="276" width="48" height="20" rx="10" fill="#F2A65A"/>
</svg>`;}

/* 마지막: 옛 사진 속 가족 (부모님 머리가 희어짐) */
function artPhoto(){return `<svg viewBox="0 0 280 210" aria-hidden="true">
  <rect width="280" height="210" fill="#4BB8D9"/><rect y="120" width="280" height="90" fill="#F6C445"/>
  <circle cx="226" cy="54" r="24" fill="#FFE7A3"/>
  ${person({x:92,y:120,s:.85,...DAD,hair:GRAY})}
  ${person({x:188,y:120,s:.85,...MOM,hair:GRAY,flip:true})}

/* ---------- 시간 격자: 점 하나 = 1주일, 한 줄 = 1년 (영상 6:19~6:34 연출) ----------
   ① 스무 살까지 매주 함께한 시간이 차오르고
   ② 앞으로 함께할 수 있는 해가 흐린 점으로 깔린 뒤 ("아직 이만큼 남은 것 같지만")
   ③ 실제로 만나는 주만 남고 나머지가 위에서부터 쫘르륵 꺼지고
   ④ 남은 분홍 점이 한 줄로 모인다 ("실제로 남은 시간은 이만큼") */
const WK=52, CHILD_ROWS=20, GAP_ROWS=3;
const COL={child:'#3E8BC9', dim:'#21497D', pink:'#E8457A', ghost:'rgba(255,255,255,.07)'};
let skipAnim=false;
const sleep=ms=>new Promise(r=>setTimeout(r,skipAnim?0:ms));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function anim(ms,f){return new Promise(res=>{const t0=performance.now();(function s(t){const k=skipAnim?1:Math.min(1,(t-t0)/ms);f(k);if(k<1)requestAnimationFrame(s);else res();})(t0);});}
/* 1년 52주 중 만나는 주: 고르게 흩어 놓음 (명절·생신 느낌) */
function weekPos(v){if(v>=WK)return [...Array(WK).keys()];return Array.from({length:v},(_,k)=>Math.min(WK-1,Math.floor((k+.5)*WK/v)));}
function tlModel(age,v){
  const R=EX[Math.min(100,Math.max(40,age))], N=Math.round(R*v), remRows=Math.max(1,Math.ceil(R-1e-9)), last=R-Math.floor(R);
  const rowLen=i=>i<remRows-1?WK:Math.max(1,Math.round(WK*(last||1)));
  const dims=[], lit=[], pos=weekPos(v), litKey=new Map();
  for(let i=0;i<remRows;i++){const L=rowLen(i);for(let c=0;c<L;c++)dims.push([i,c]);
    for(const c of pos)if(c<L&&lit.length<N){litKey.set(i*WK+c,lit.length);lit.push([i,c]);}}
  for(let i=remRows-1;i>=0&&lit.length<N;i--){const L=rowLen(i);for(let c=0;c<L&&lit.length<N;c++){const k=i*WK+c;if(!litKey.has(k)){litKey.set(k,lit.length);lit.push([i,c]);}}}
  return {R,N,v,age,remRows,dims,lit,litKey};
}
function makeTL(m){
  const avail=Math.min(420,(document.querySelector('.app').clientWidth||360)-36);
  const cell=Math.max(4,Math.floor(avail/WK)), rows=CHILD_ROWS+GAP_ROWS+m.remRows;
  const c=document.createElement('canvas'),dpr=Math.max(1,Math.round(window.devicePixelRatio||1));
  c.width=WK*cell*dpr;c.height=rows*cell*dpr;c.style.width=WK*cell+'px';c.style.height=rows*cell+'px';c.style.margin='0 auto';
  const x=c.getContext('2d');x.scale(dpr,dpr);const r=cell*.38,y0=CHILD_ROWS+GAP_ROWS;
  const dot=(row,col,color,a=1)=>{x.globalAlpha=a;x.fillStyle=color;x.beginPath();x.arc(col*cell+cell/2,row*cell+cell/2,r,0,6.2832);x.fill();};
  const label=(t,color)=>{x.globalAlpha=1;x.fillStyle=color;x.font=`700 ${Math.max(13,Math.round(cell*2.3))}px "Noto Sans KR",sans-serif`;x.textBaseline='middle';x.fillText(t,0,(CHILD_ROWS+GAP_ROWS/2)*cell);};
  /* p = {child, dim, drain, pack} 각 0~1 */
  function draw(p){
    x.clearRect(0,0,WK*cell,rows*cell);
    const nc=Math.floor(p.child*CHILD_ROWS*WK);for(let i=0;i<nc;i++)dot(Math.floor(i/WK),i%WK,COL.child);
    if(p.dim>0)label(p.pack>0?'실제로 만나는 날':'지금부터',p.drain>0?COL.pink:'rgba(255,255,255,.75)');
    const nd=Math.floor(p.dim*m.dims.length), dr=p.drain*(m.remRows+1);
    for(let j=0;j<nd;j++){const [i,c]=m.dims[j];if(m.litKey.has(i*WK+c))continue;const f=Math.min(1,Math.max(0,(dr-i)*.9));if(f<1)dot(y0+i,c,COL.dim,1-f);}
    const e=ease(p.pack);
    for(let k=0;k<m.lit.length;k++){const [i,c]=m.lit[k];if(i*WK+c>=nd&&p.pack===0)continue;
      let row=y0+i,col=c,color=(dr>i||p.pack>0)?COL.pink:COL.dim;
      if(p.pack>0){row+= (y0+Math.floor(k/WK)-row)*e; col+=(k%WK-col)*e;}
      dot(row,col,color);}
    x.globalAlpha=1;
  }
  /* 바꿔보기용: 어린 시절 + (매주 만난다면 채워질 자리) 흐린 칸 + 분홍 n개 */
  function drawPacked(n,ghostN){
    x.clearRect(0,0,WK*cell,rows*cell);
    for(let i=0;i<CHILD_ROWS*WK;i++)dot(Math.floor(i/WK),i%WK,COL.child);
    label('앞으로 만나는 날',COL.pink);
    for(let k=0;k<ghostN;k++)dot(y0+Math.floor(k/WK),k%WK,COL.ghost);
    for(let k=0;k<n;k++)dot(y0+Math.floor(k/WK),k%WK,COL.pink);
  }
  /* 모인 뒤 격자 자체가 줄어듦: 빈자리를 접어 올림 */
  const wrap=document.createElement('div');wrap.style.overflow='hidden';wrap.style.height=rows*cell+'px';wrap.appendChild(c);
  const packedRows=n=>y0+Math.max(1,Math.ceil(n/WK))+1;
  function shrink(k,n){const full=rows*cell, to=packedRows(n)*cell;wrap.style.height=(full+(to-full)*ease(k))+'px';}
  return {c:wrap,draw,drawPacked,shrink};
}
/* 단계 진행: 탭하면 진행 중인 움직임은 끝까지 감고, 끝났으면 다음 단계 */
let tapHook=null;
function runSteps(steps,onDone){let si=0,busy=false;const my=sceneSeq;
  const run=async()=>{busy=true;skipAnim=false;await steps[si]();if(my!==sceneSeq)return;skipAnim=false;busy=false;const h=stage.querySelector('.hint');h&&h.classList.add('on');if(si===steps.length-1&&onDone)onDone();};
  tapHook=()=>{if(busy){skipAnim=true;return true;}if(si<steps.length-1){si++;const h=stage.querySelector('.hint');h&&h.classList.remove('on');run();return true;}return false;};
  run();}
function setCap(lines){const el=stage.querySelector('.cap');if(!el)return;el.innerHTML=lines.map(l=>`<p>${l}</p>`).join('');
  [...el.children].forEach((p,i)=>setTimeout(()=>p.classList.add('on'),skipAnim?0:i*700));}

/* 날 수 → "약 3개월" 같은 말 */
function daysToSpan(d){if(d<14)return `${d}일`;if(d<60)return `약 ${Math.round(d/7)}주`;if(d<730)return `약 ${Math.round(d/30.4)}개월`;
  const y=Math.floor(d/365),mo=Math.round((d-y*365)/30.4);return mo>0&&mo<12?`약 ${y}년 ${mo}개월`:`약 ${Math.round(d/365)}년`;}
function countUp(el,to,ms){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);el.innerHTML=`${Math.round(to*k).toLocaleString()}<small>번</small>`;if(k<1)requestAnimationFrame(f);})(t0);}

    <div class="cap"><p class="on">앞으로 ${left.toLocaleString()}번.<br>그 한 번 한 번에,</p></div>
    <div class="qcard"><p class="qk">이번 주, 부모님께 이것 하나만 물어보세요</p><div class="qt" id="qt">"${QUESTIONS[qi]}"</div>
      <div class="qrow"><button type="button" id="redraw">다른 질문 뽑기</button><button type="button" id="copyQ">질문 복사</button></div></div>
    <div class="end">
      <button class="btn" type="button" id="toGift">다음에 찾아뵐 때, 드릴 선물 →</button>
    </div>
  </section>`;
  requestAnimationFrame(()=>setTimeout(()=>{const ph=$('photo');ph&&ph.classList.add('on');},60));
  $('redraw').addEventListener('click',()=>{qi=(qi+1+Math.floor(Math.random()*(QUESTIONS.length-1)))%QUESTIONS.length;drawn++;$('qt').textContent=`"${QUESTIONS[qi]}"`;track('question_draw',{n:drawn});});
  $('copyQ').addEventListener('click',async()=>{track('share_click',{channel:'question_copy',place:'final'});toast(await copyText(QUESTIONS[qi])?'질문을 복사했어요':'복사하지 못했어요');});
  $('toGift').addEventListener('click',()=>{track('cta_click',{type:'gift',place:'photo'});next();});
}

/* ---------- 마지막: 다음 상품(부모님 이야기 책) 관심도 확인 ----------
   아직 없는 상품이라 판매하지 않습니다. "관심 있어요"와 언제·어떤 형태를 원하는지만 이름 없이 셉니다. */
const OCCASIONS=['생신','어버이날','명절','결혼기념일','특별한 날 없이'];
const FORMATS=['종이책','휴대폰으로 보는 책','둘 다'];
function artBook(){return `<svg class="art" viewBox="0 0 360 230" aria-hidden="true" style="max-width:340px">
  <ellipse cx="180" cy="214" rx="150" ry="10" fill="#E9A23B"/>
  <path d="M30 40 Q105 22 178 44 V206 Q105 186 30 202Z" fill="#FFFDF7"/><path d="M330 40 Q255 22 182 44 V206 Q255 186 330 202Z" fill="#FFFDF7"/>
  <rect x="178" y="44" width="4" height="162" fill="#E2D9C3"/>
  <g transform="rotate(-4 100 96)"><rect x="56" y="62" width="92" height="70" fill="#fff" stroke="#E2D9C3"/><rect x="62" y="68" width="80" height="50" fill="#4BB8D9"/><rect x="62" y="100" width="80" height="18" fill="#F6C445"/>
    ${person({x:86,y:96,s:.38,...DAD})}${person({x:118,y:96,s:.38,...MOM,flip:true})}</g>
  <rect x="58" y="146" width="96" height="5" rx="2.5" fill="#D9D2C0"/><rect x="58" y="158" width="84" height="5" rx="2.5" fill="#D9D2C0"/><rect x="58" y="170" width="90" height="5" rx="2.5" fill="#D9D2C0"/>
  <rect x="206" y="66" width="98" height="62" rx="6" fill="#1D2433"/><polygon points="246,84 246,110 268,97" fill="#fff"/>
  <rect x="206" y="146" width="96" height="5" rx="2.5" fill="#D9D2C0"/><rect x="206" y="158" width="72" height="5" rx="2.5" fill="#D9D2C0"/>
  <g transform="translate(282 160)"><rect width="26" height="26" fill="#fff" stroke="#1D2433" stroke-width="2"/><rect x="4" y="4" width="7" height="7" fill="#1D2433"/><rect x="15" y="4" width="7" height="7" fill="#1D2433"/><rect x="4" y="15" width="7" height="7" fill="#1D2433"/><rect x="15" y="15" width="3" height="3" fill="#1D2433"/><rect x="19" y="19" width="3" height="3" fill="#1D2433"/></g>
</svg>`;}
function renderGift(){
  stage.innerHTML=`<section class="scene gift">
    <p class="gk">다음에 찾아뵐 때 드릴 선물</p>
    <h2 class="gt">부모님의 이야기를<br>한 권의 책으로</h2>
    ${artBook()}
    <ol class="steps">
      <li><b>질문을 드리고</b><span>첫 만남, 내가 태어난 날, 가장 힘들었던 해</span></li>
      <li><b>목소리와 옛 사진·영상을 모아</b><span>결혼식 비디오, 앨범 속 사진, 오늘 나눈 대화까지</span></li>
      <li><b>글·사진·영상이 함께 담긴 책으로</b><span>종이책으로 넘기고, 휴대폰으로 그날의 영상을 다시 봅니다</span></li>
    </ol>
    <p class="gnote">지금 준비하고 있는 선물입니다. 관심 있다고 알려 주시면 먼저 만들어 보겠습니다.</p>
    <button class="btn" type="button" id="want">이런 선물, 관심 있어요</button>
    <div id="more" hidden>
      <p class="thanks">고맙습니다. 두 가지만 더 알려 주세요.</p>
      <div class="q"><div class="ql">언제 드리고 싶으세요?</div><div class="chips3" id="occ">${OCCASIONS.map(o=>`<button class="chip" type="button" data-v="${o}">${o}</button>`).join('')}</div></div>
      <div class="q"><div class="ql">어떤 형태가 좋으세요?</div><div class="chips3" id="fmt">${FORMATS.map(o=>`<button class="chip" type="button" data-v="${o}">${o}</button>`).join('')}</div></div>
    </div>
    <button class="btn ghost" type="button" id="share">형제·가족에게 이 페이지 보내기</button>
    <details class="src" id="src"><summary>계산 방법과 출처</summary><ul>${HOW_LIST}</ul></details>
    <button class="again" type="button" id="again">처음부터 다시 보기</button>
  </section>`;
  $('want').addEventListener('click',()=>{if(!$('more').hidden)return;track('gift_interest');$('want').textContent='관심 있다고 전했어요 ✓';$('want').disabled=true;$('more').hidden=false;$('more').scrollIntoView({behavior:'smooth',block:'nearest'});});
  const pick=(id,ev)=>$(id).addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;$(id).querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const k='g:'+id;if(!FIRED.has(k)){FIRED.add(k);track(ev,{v:b.dataset.v});}});
  pick('occ','gift_occasion');pick('fmt','gift_format');
  $('share').addEventListener('click',shareFamily);
  $('src').addEventListener('toggle',e=>{if(e.target.open)trackOnce('how_open');});
  $('again').addEventListener('click',()=>{state.v=null;go(0);});
}

/* ---------- 공유 ---------- */
function shareUrl(){const u=new URL(location.origin+location.pathname);u.searchParams.set('s',Math.random().toString(36).slice(2,8));return u.toString();}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}a.remove();return ok;}}
async function shareFamily(){track('share_click',{channel:'family',place:'final'});
  const url=shareUrl(), msg='앞으로 부모님을 몇 번 더 만날 수 있을까. 계산해 봤어. 너도 해봐.';
  if(navigator.share){try{await navigator.share({title:'앞으로 몇 번',text:msg,url});return;}catch(e){}}
  toast(await copyText(msg+' '+url)?'링크를 복사했어요. 가족 단톡방에 붙여넣어 주세요':'복사하지 못했어요');}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200);}

/* 공유 링크로 처음 들어온 경우 (친구의 숫자는 보여주지 않음) */
const qs=new URLSearchParams(location.search);
const fromShare=/^[a-z0-9]{4,10}$/.test(qs.get('s')||'');
(function(){if(!fromShare)return;const key='mlab_sv_'+SVC;let seen=false;
  try{seen=!!localStorage.getItem(key);if(!seen)localStorage.setItem(key,'1');}catch(e){}
  if(!seen)track('share_visit');})();
function friendBanner(){return fromShare&&cur===0?`<div class="friend">가족이 보내준 링크예요. 화면을 눌러 천천히 넘겨 보세요.</div>`:'';}

/* ---------- 탭해서 넘기기 ---------- */
stage.addEventListener('click',e=>{
  const sc=e.target.closest('.scene.tap');if(!sc)return;
  if(tapHook&&tapHook())return;
  const capDone=[...sc.querySelectorAll('.cap p')].every(p=>p.classList.contains('on'));
  if(!capDone){skipAnim=true;sc.querySelectorAll('.cap p').forEach(p=>p.classList.add('on'));const h=sc.querySelector('.hint');h&&h.classList.add('on');return;}
  if(cur===0)trackOnce('start');
  next();
});
document.addEventListener('keydown',e=>{if((e.key===' '||e.key==='ArrowRight'||e.key==='Enter')&&stage.querySelector('.scene.tap')){e.preventDefault();stage.querySelector('.scene.tap').click();}});
$('skip').addEventListener('click',()=>{trackOnce('start',{skip:true});go(SCENES.indexOf('ask'));});

go(0);
</script>
</body>
</html>
